<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface-2: #222228;
      --border: #2e2e38;
      --text: #f0f0f4;
      --text-muted: #7c7c8a;
      --accent: #6c63ff;
      --accent-dim: rgba(108, 99, 255, 0.12);
      --green: #34d399;
      --red: #f87171;
      --radius: 10px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    header {
      padding: 32px 24px 20px;
      max-width: 680px;
      margin: 0 auto;
    }

    .logo {
      font-size: 13px;
      font-family: var(--mono);
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    h1 span {
      color: var(--text-muted);
      font-weight: 400;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }

    .stat {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text-muted);
    }

    .stat strong {
      color: var(--text);
      font-weight: 500;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"], textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      resize: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    button {
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 7px;
      padding: 9px 18px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .btn-ghost:hover { color: var(--text); }

    .btn-danger {
      background: transparent;
      color: var(--red);
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: border-color 0.15s;
    }

    .task-card:hover { border-color: #3e3e4a; }

    .task-card.completed { opacity: 0.5; }

    .check-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      flex-shrink: 0;
      margin-top: 1px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }

    .check-btn:hover { border-color: var(--accent); }

    .task-card.completed .check-btn {
      background: var(--green);
      border-color: var(--green);
    }

    .check-icon {
      display: none;
      width: 10px;
      height: 10px;
    }

    .task-card.completed .check-icon { display: block; }

    .task-body { flex: 1; min-width: 0; }

    .task-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
    }

    .task-card.completed .task-title { text-decoration: line-through; }

    .task-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.5;
    }

    .task-meta {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      margin-top: 6px;
    }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-self: center;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 5px 9px;
      font-size: 12px;
    }

    .btn-icon:hover { color: var(--text); border-color: #3e3e4a; }

    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
    }

    .empty-state p { font-size: 14px; margin-top: 8px; }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    .modal h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      z-index: 200;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }

    .error-msg {
      font-size: 12px;
      color: var(--red);
      margin-top: 6px;
      display: none;
    }

    @media (max-width: 520px) {
      .task-card { flex-wrap: wrap; }
      .task-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Taskflow</div>
  <h1>Your tasks,<br><span>organised.</span></h1>
  <div class="stats">
    <div class="stat"><strong id="stat-total">0</strong> total</div>
    <div class="stat"><strong id="stat-done">0</strong> done</div>
    <div class="stat"><strong id="stat-pending">0</strong> pending</div>
  </div>
</header>

<main>
  <div class="add-form">
    <div class="form-row">
      <input type="text" id="new-title" placeholder="Task title" maxlength="255" />
      <textarea id="new-desc" placeholder="Description (optional)" rows="2" maxlength="1000"></textarea>
      <div class="error-msg" id="add-error"></div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="addTask()">Add task</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Done</button>
  </div>

  <div class="task-list" id="task-list"></div>
</main>

<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <h2>Edit task</h2>
    <div class="form-row">
      <input type="text" id="edit-title" placeholder="Task title" maxlength="255" />
      <textarea id="edit-desc" placeholder="Description (optional)" rows="3" maxlength="1000"></textarea>
      <div class="error-msg" id="edit-error"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let tasks = [];
  let currentFilter = 'all';
  let editingId = null;

  async function fetchTasks() {
    const res = await fetch('/tasks');
    tasks = await res.json();
    render();
  }

  async function addTask() {
    const title = document.getElementById('new-title').value.trim();
    const description = document.getElementById('new-desc').value.trim() || null;
    const errEl = document.getElementById('add-error');

    if (!title) {
      errEl.textContent = 'Title is required.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    const res = await fetch('/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description })
    });

    if (res.ok) {
      const task = await res.json();
      tasks.unshift(task);
      document.getElementById('new-title').value = '';
      document.getElementById('new-desc').value = '';
      render();
      showToast('Task added', 'success');
    } else {
      const err = await res.json();
      errEl.textContent = err.detail?.[0]?.msg || 'Something went wrong.';
      errEl.style.display = 'block';
    }
  }

  async function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    const res = await fetch(`/tasks/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed: !task.completed })
    });
    if (res.ok) {
      const updated = await res.json();
      tasks = tasks.map(t => t.id === id ? updated : t);
      render();
    }
  }

  async function deleteTask(id) {
    const res = await fetch(`/tasks/${id}`, { method: 'DELETE' });
    if (res.ok) {
      tasks = tasks.filter(t => t.id !== id);
      render();
      showToast('Task deleted', 'success');
    }
  }

  function openEdit(id) {
    const task = tasks.find(t => t.id === id);
    editingId = id;
    document.getElementById('edit-title').value = task.title;
    document.getElementById('edit-desc').value = task.description || '';
    document.getElementById('edit-error').style.display = 'none';
    document.getElementById('edit-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  }

  async function saveEdit() {
    const title = document.getElementById('edit-title').value.trim();
    const description = document.getElementById('edit-desc').value.trim() || null;
    const errEl = document.getElementById('edit-error');

    if (!title) {
      errEl.textContent = 'Title is required.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    const res = await fetch(`/tasks/${editingId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description })
    });

    if (res.ok) {
      const updated = await res.json();
      tasks = tasks.map(t => t.id === editingId ? updated : t);
      closeModal();
      render();
      showToast('Task updated', 'success');
    } else {
      const err = await res.json();
      errEl.textContent = err.detail?.[0]?.msg || 'Something went wrong.';
      errEl.style.display = 'block';
    }
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const total = tasks.length;
    const done = tasks.filter(t => t.completed).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-pending').textContent = total - done;

    const visible = tasks.filter(t => {
      if (currentFilter === 'done') return t.completed;
      if (currentFilter === 'pending') return !t.completed;
      return true;
    });

    const list = document.getElementById('task-list');

    if (visible.length === 0) {
      list.innerHTML = `<div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
        <p>${currentFilter === 'done' ? 'No completed tasks yet.' : currentFilter === 'pending' ? 'Nothing pending.' : 'Add your first task above.'}</p>
      </div>`;
      return;
    }

    list.innerHTML = visible.map(task => {
      const date = new Date(task.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `<div class="task-card ${task.completed ? 'completed' : ''}">
        <button class="check-btn" onclick="toggleTask(${task.id})" title="${task.completed ? 'Mark incomplete' : 'Mark complete'}">
          <svg class="check-icon" viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2">
            <path d="M1.5 5l2.5 2.5 4.5-4.5"/>
          </svg>
        </button>
        <div class="task-body">
          <div class="task-title">${escHtml(task.title)}</div>
          ${task.description ? `<div class="task-desc">${escHtml(task.description)}</div>` : ''}
          <div class="task-meta">${date}</div>
        </div>
        <div class="task-actions">
          <button class="btn-icon" onclick="openEdit(${task.id})" title="Edit">Edit</button>
          <button class="btn-icon btn-danger" onclick="deleteTask(${task.id})" title="Delete">Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  document.getElementById('new-title').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTask(); }
  });

  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('edit-modal')) closeModal();
  });

  fetchTasks();
</script>
</body>
</html>
